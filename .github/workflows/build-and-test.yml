name: Build and Test

on:
  push:
    branches: [ master, main ]
    tags: [ '*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  RFG_CACHE_PREFIX: rfg-linux-
  ARTIFACT_PREFIX: Textures_Patcher

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Restore RetroFuturaGradle cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/rfg/srg_merged_minecraft.jar
            build/rfg/*_patched_minecraft-sources.jar*
          key: ${{ env.RFG_CACHE_PREFIX }}miss
          restore-keys: |
            ${{ env.RFG_CACHE_PREFIX }}

      - name: Setup workspace
        run: ./gradlew --build-cache --stacktrace setupCIWorkspace

      - name: Build
        run: ./gradlew --build-cache --stacktrace build

      - name: Prepare artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.gradle.kts | head -n 1)
          if [[ -z "$VERSION" ]]; then
            echo "::error::didn't get version from build.gradle.kts"
            exit 1
          fi

          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          BRANCH="${BRANCH//\//-}"
          SHA="${GITHUB_SHA:0:7}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            BRANCH="release"
          fi

          BASE="${ARTIFACT_PREFIX}-${VERSION}-${BRANCH}-${SHA}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "::error::tag '${GITHUB_REF_NAME}' 与 build.gradle.kts 的 version '${VERSION}' 不一致，请先改版本号再打 tag"
              exit 1
            fi
            echo "tag=${GITHUB_REF_NAME}"
          fi

          shopt -s nullglob
          main=() dev=() src=()
          for f in build/libs/*.jar; do
            case "$f" in
              *-dev.jar)     dev+=("$f") ;;
              *-sources.jar) src+=("$f") ;;
              *-api.jar)     echo "skip api jar: $f" ;;
              *)             main+=("$f") ;;
            esac
          done

          for pair in "main:${#main[@]}" "dev:${#dev[@]}" "src:${#src[@]}"; do
            if [[ "${pair#*:}" -ne 1 ]]; then
              echo "::error::the number of ${pair%%:*} jar in build/libs is ${pair#*:}, which should be 1"
              ls -l build/libs/ || true
              exit 1
            fi
          done

          rm -rf dist && mkdir -p dist
          cp "${main[0]}" "dist/${BASE}.jar"
          cp "${src[0]}"  "dist/${BASE}-source.jar"
          cp "${dev[0]}"  "dist/${BASE}-dev.jar"

          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "jar=dist/${BASE}.jar" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Compute RetroFuturaGradle cache key
        id: rfg-key
        shell: bash
        run: |
          if compgen -G "build/rfg/*.inputs.sha256" > /dev/null; then
            digest=$(cat build/rfg/*.inputs.sha256 | sha256sum | cut -c1-32)
            echo "key=${RFG_CACHE_PREFIX}${digest}" >> "$GITHUB_OUTPUT"
          fi

      - name: Save RetroFuturaGradle cache
        if: steps.rfg-key.outputs.key != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build/rfg/srg_merged_minecraft.jar
            build/rfg/*_patched_minecraft-sources.jar*
          key: ${{ steps.rfg-key.outputs.key }}

      - name: Verify jar contents and mixin refmap
        shell: bash
        run: |
          set -euo pipefail

          JAR="${{ steps.artifacts.outputs.jar }}"
          if [[ ! -f "$JAR" ]]; then
            echo "::error::cannot find product $JAR"
            exit 1
          fi
          echo "product: $JAR ($(du -h "$JAR" | cut -f1))"

          python3 - "$JAR" <<'PY'
          import json, re, sys, zipfile

          jar_path = sys.argv[1]
          required = [
              "mcmod.info",
              "mixins.texturespatcher.json",
              "mixins.texturespatcher.refmap.json",
          ]

          with zipfile.ZipFile(jar_path) as z:
              names = set(z.namelist())
              missing = [n for n in required if n not in names]
              if missing:
                  print(f"::error::jar missing necessary thing: {missing}")
                  sys.exit(1)

              cfg = json.loads(z.read("mixins.texturespatcher.json"))
              refmap = json.loads(z.read("mixins.texturespatcher.refmap.json"))

          mixins = cfg.get("client", [])
          if not mixins:
              print("::error::mixin configured client array is null")
              sys.exit(1)

          package = cfg.get("package", "").replace(".", "/")
          errors, warnings = [], []

          for name in mixins:
              if f"{package}/{name}.class" not in names:
                  errors.append(f"mixin class not be packaged: {package}/{name}.class")

          mappings = refmap.get("mappings", {})
          if not mappings:
              errors.append("no mappings in refmap.")

          unmapped = [n for n in mixins if f"{package}/{n}" not in mappings]
          if unmapped and len(unmapped) == len(mixins):
              errors.append(f"all mixin not in refmap, remap process failed: {unmapped}")
          elif unmapped:
              warnings.append(f"didn't appeared in refmap (ussually remap=false): {unmapped}")

          bad = []
          for name in mixins:
              for key, value in mappings.get(f"{package}/{name}", {}).items():
                  if isinstance(value, str) and not re.search(r"func_|field_", value):
                      bad.append(f"{name}.{key} -> {value}")
          if bad:
              errors.append(f"The following injection was not resolved to an srg name: {bad}")

          for w in warnings:
              print(f"::warning::{w}")
          for e in errors:
              print(f"::error::{e}")
          if errors:
              sys.exit(1)

          total = sum(len(v) for v in mappings.values())
          print(f"OK: {len(mixins)}  mixin、{total} injection mapping verification passed")
          for name in sorted(mixins):
              count = len(mappings.get(package + "/" + name, {}))
              print(f"  - {name}: {count} 条映射")
          PY

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.base }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload jars to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*.jar
          fail_on_unmatched_files: true
